<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Low contrast</title>
  <style>
    body { background: #ffffff; color: #111111; font: 16px/1.5 sans-serif; }
    .low { color: #eeeeee; background: #ffffff; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Contrast</h1>
    <p class="low">This paragraph is nearly invisible on a white background.</p>
  </main>
</body>
</html>
