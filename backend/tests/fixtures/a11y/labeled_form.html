<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Labeled form</title>
</head>
<body>
  <main>
    <h1>Subscribe</h1>
    <form>
      <label for="email">Email</label>
      <input id="email" name="email" type="email">
      <button type="submit">Subscribe</button>
    </form>
  </main>
</body>
</html>
