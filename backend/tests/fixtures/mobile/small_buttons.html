<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Small buttons</title>
  <style>
    body { margin: 0; padding: 16px; font: 16px sans-serif; }
    .tiny { width: 20px; height: 20px; padding: 0; font-size: 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Tiny controls</h1>
    <button class="tiny" type="button" aria-label="Add">+</button>
    <button class="tiny" type="button" aria-label="Remove">-</button>
  </main>
</body>
</html>
