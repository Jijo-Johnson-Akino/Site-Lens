<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipped heading</title>
  <style>
    body { margin: 0; padding: 16px; font: 16px sans-serif; }
    h1 { width: 120px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <main>
    <h1>This heading is far too long to fit inside a 120 pixel box on mobile</h1>
    <p>The heading should clip.</p>
  </main>
</body>
</html>
