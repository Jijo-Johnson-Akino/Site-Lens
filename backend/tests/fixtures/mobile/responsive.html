<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive mobile</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 sans-serif; }
    header, nav, main { max-width: 100%; padding: 16px; }
    nav a { display: inline-block; padding: 12px 10px; }
    img { max-width: 100%; height: auto; }
    .cta { display: inline-block; min-width: 44px; min-height: 44px; padding: 12px 20px; background: #0f766e; color: #fff; text-decoration: none; }
    label { display: block; margin-top: 8px; }
    input, button { min-height: 44px; max-width: 100%; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Home</a>
      <a href="/about">About</a>
    </nav>
  </header>
  <main>
    <h1>Welcome</h1>
    <p>Main content stays inside a 390px viewport.</p>
    <img alt="Hero" width="800" height="200" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
    <p><a class="cta" href="/start">Get Started</a></p>
    <form action="/signup" method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <button type="submit">Request access</button>
    </form>
  </main>
</body>
</html>
