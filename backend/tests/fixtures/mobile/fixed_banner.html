<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixed banner</title>
  <style>
    body { margin: 0; font: 16px sans-serif; padding-bottom: 400px; }
    .banner { position: fixed; left: 0; right: 0; bottom: 0; height: 400px; background: #111; color: #fff; z-index: 20; }
  </style>
</head>
<body>
  <main>
    <h1>Sticky promo</h1>
    <p>Primary content sits above a large fixed bottom banner.</p>
  </main>
  <div class="banner">Promotional banner covering a large share of the mobile viewport.</div>
</body>
</html>
