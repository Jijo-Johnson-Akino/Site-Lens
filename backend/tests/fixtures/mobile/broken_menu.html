<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broken mobile menu</title>
  <style>
    body { margin: 0; font: 16px sans-serif; }
    nav { display: none; }
    button { min-width: 44px; min-height: 44px; }
  </style>
</head>
<body>
  <header>
    <button type="button" aria-label="Menu" class="hamburger">Menu</button>
    <nav>
      <a href="/">Home</a>
      <a href="/about">About</a>
    </nav>
  </header>
  <main>
    <h1>Broken menu</h1>
    <p>The menu button does not reveal navigation.</p>
  </main>
</body>
</html>
