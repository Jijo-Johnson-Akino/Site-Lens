<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Small text</title>
  <style>
    body { margin: 0; padding: 16px; }
    p.fine { font-size: 9px; }
  </style>
</head>
<body>
  <main>
    <h1>Fine print</h1>
    <p class="fine">This paragraph is intentionally set to nine pixels so the mobile typography check can measure it as below the configured minimum size on a phone viewport.</p>
  </main>
</body>
</html>
