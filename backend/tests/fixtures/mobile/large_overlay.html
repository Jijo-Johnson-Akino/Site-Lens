<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Large overlay</title>
  <style>
    body { margin: 0; font: 16px sans-serif; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); color: #fff; z-index: 40; padding: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Hidden by overlay</h1>
    <p>Primary content sits behind a full-screen overlay.</p>
  </main>
  <div class="modal">Subscribe to our newsletter overlay covering the page.</div>
</body>
</html>
