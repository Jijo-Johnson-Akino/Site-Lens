<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mobile navigation overflow</title>
  <style>
    body { margin: 0; font: 16px/1.4 sans-serif; }
    nav { white-space: nowrap; }
    nav a { display: inline-block; padding: 12px 28px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Home</a>
      <a href="/products">Products</a>
      <a href="/solutions">Solutions</a>
      <a href="/customers">Customers</a>
      <a href="/resources">Resources</a>
      <a href="/pricing">Pricing</a>
      <a href="/company">Company</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>
  <main>
    <h1>Long navigation</h1>
    <p>Navigation items are forced onto one row and overflow a 390px viewport.</p>
  </main>
</body>
</html>
