<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlapping elements</title>
  <style>
    body { margin: 0; font: 16px/1.4 sans-serif; }
    .block-a { position: absolute; left: 16px; top: 80px; width: 260px; height: 140px; background: #fecaca; }
    .block-b { position: absolute; left: 48px; top: 110px; width: 260px; height: 140px; background: #bfdbfe; }
  </style>
</head>
<body>
  <main>
    <h1>Overlap</h1>
    <p class="block-a">First overlapping paragraph with enough visible text to measure.</p>
    <p class="block-b">Second overlapping paragraph with enough visible text to measure.</p>
  </main>
</body>
</html>
